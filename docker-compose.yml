version: '3.8'

services:
  # Cloud/Local PostgreSQL Container
  postgres:
    image: postgres:15-alpine
    container_name: voltpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: energypassword
      POSTGRES_DB: energy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  # Node.js Express API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voltpulse-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:energypassword@postgres:5432/energy_db
    depends_on:
      - postgres

  # React Frontend Dashboard
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: voltpulse-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
